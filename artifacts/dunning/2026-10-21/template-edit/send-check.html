<!doctype html><meta charset="utf-8"><title>Dunning unified-template send check</title><style>body{font:15px system-ui;margin:24px}button{padding:10px}pre{white-space:pre-wrap;padding:16px;background:#f5f2fa}iframe{width:100%;height:650px;border:1px solid #ddd}</style><h1>Unified template send check</h1><p>Artifact-only controls. Uses the real saved email catalogue, uploaded Word letter and browser engine. Sending is simulated.</p><button id="run">Run sample DL1 and DL2</button><pre id="result"></pre><iframe id="mail" sandbox="" title="Actual sent email"></iframe>
<script src="../../../../scripts/template-master-data.js"></script><script src="../../../../scripts/dunning-template-adapter.js"></script><script src="../../../../scripts/dunning-core.js"></script><script src="../../../../scripts/vendor/jspdf.umd.min.js"></script><script src="../../../../scripts/dunning-documents.js"></script><script>
const core=IneburaDunning,actor={role:'client-admin',userId:'demo-user',clientId:'demo-client'};
document.getElementById('run').onclick=()=>{try{const before=core.getState();if(before.emails.length)throw Error('This isolated check was already run.');const strategy=before.strategies.find(s=>s.id==='dunning-strategy-demo');core.saveStrategy({...strategy,status:'active',subClientId:'North'},actor);core.runDaily('2026-10-20',{actor,outcome:'success'});core.runDaily('2026-10-27',{actor,outcome:'success'});const emails=core.getState().emails,first=emails.find(e=>e.stage===1),second=emails.find(e=>e.stage===2);if(first.subject!=='Dunning Letter One QA'||first.letterSnapshot.template.sourceFileName!=='valid-first.docx'||second.letterSnapshot.template.sourceFileName!=='valid-follow-up.docx'||/\$\{|<#|\{\{/.test(first.body+second.body))throw Error('Snapshot assertion failed.');document.getElementById('result').textContent=JSON.stringify({pass:true,letters:emails.map(e=>({subject:e.subject,stage:e.stage,source:e.letterSnapshot.template.emailTemplateSource.code,word:e.letterSnapshot.template.sourceFileName,retainedPdf:e.letterSnapshot.pdfDataUri?.startsWith('data:application/pdf'),reference:e.reference}))},null,2);document.getElementById('mail').srcdoc='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src \'self\' data:;">'+first.body;}catch(e){document.getElementById('result').textContent=e.message;}};
</script>
