<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Issue Tracker approval…</title>
</head>
<body>
  <p>This approval now opens inside Issue Tracker. <a id="fallback" href="../../pages/issuetrackerLP.html?view=my-work&amp;role=manager">Open My Work</a>.</p>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const requestId = params.get('id') || params.get('request');
      let requests = [];
      try { requests = JSON.parse(localStorage.getItem('approval_requests') || '[]'); } catch (_) {}
      const request = Array.isArray(requests) ? requests.find((item) => item && item.id === requestId) : null;
      localStorage.setItem('issue_tracker_role', 'manager');
      const requestedUser = params.get('user');
      const currentLevel = Number(request && request.currentLevel || 1);
      const currentOwner = request && Array.isArray(request.levels)
        ? request.levels.find((item) => Number(item.level) === currentLevel) || request.levels[currentLevel - 1]
        : null;
      if (requestedUser || currentOwner && currentOwner.ownerName) {
        const activeUser = requestedUser || currentOwner.ownerName;
        localStorage.setItem('approver_active_user', activeUser);
        localStorage.setItem('issue_tracker_active_user', activeUser);
        localStorage.setItem('issue_tracker_active_user_manager', activeUser);
      }
      const target = request && request.invoice && request.issue
        ? `../../pages/issuetrackerdetail.html?${new URLSearchParams({ invoice: request.invoice.id || '', issue: request.issue.id || '', request: request.id || '', role: 'manager', user: requestedUser || currentOwner?.ownerName || 'Meera Iyer' })}`
        : '../../pages/issuetrackerLP.html?view=my-work&role=manager';
      document.getElementById('fallback').href = target;
      location.replace(target);
    })();
  </script>
</body>
</html>
