<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inebura Ops | Login 2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #6b7280;
      --brand: #5c258d;
      --brand-dark: #4b1f73;
      --accent: #f59e0b;
      --brand-soft: #f6effb;
      --brand-border: #d7c3ea;
      --brand-rgb: 92, 37, 141;
      --surface: #ffffff;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Assistant", sans-serif;
      background:
        linear-gradient(120deg, rgba(92, 37, 141, 0.18), transparent 45%),
        linear-gradient(240deg, rgba(245, 158, 11, 0.14), transparent 55%),
        #f8fafc;
      color: var(--ink);
      padding: 24px;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Assistant", sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      z-index: 5;
    }

    .logo img {
      width: 125px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }

    .frame {
      max-width: 960px;
      margin: 80px auto 24px;
      background: var(--surface);
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    }

    .cover {
      padding: 34px;
      background:
        linear-gradient(160deg, #f6effb 0%, #ede1f7 60%, #fff7ed 100%);
      position: relative;
    }

    .cover::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -40px;
      bottom: -40px;
      background: rgba(92, 37, 141, 0.2);
      border-radius: 30% 70% 60% 40%;
    }

    .cover h1 {
      font-family: "Fraunces", serif;
      font-size: 34px;
      margin: 0 0 12px;
    }

    .cover p {
      margin: 0 0 16px;
      color: #675a78;
      line-height: 1.6;
    }

    .cover .stat {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .statCard {
      background: #fff;
      border-radius: 16px;
      padding: 12px;
      border: 1px solid var(--brand-border);
      font-size: 13px;
      color: #675a78;
    }

    .panel {
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel h2 {
      font-family: "Fraunces", serif;
      margin: 0;
    }

    .switch {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .switch button {
      border: 1px solid var(--border);
      background: #ffffff;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      color: var(--muted);
      font-family: "Assistant", sans-serif;
    }

    .switch button.active {
      border-color: var(--brand);
      color: var(--ink);
      background: var(--brand-soft);
    }

    label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 14px;
      font-family: "Assistant", sans-serif;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(var(--brand-rgb), 0.18);
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid.two {
      grid-template-columns: 1fr 1fr;
    }

    .primaryBtn {
      border: none;
      background: var(--brand);
      color: #ffffff;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .primaryBtn:hover { background: var(--brand-dark); }

    .ghostBtn {
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .mergeField {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
    }

    .mergeField:focus-within {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(var(--brand-rgb), 0.16);
    }

    .mergeField input {
      border: none;
      padding: 8px 10px;
      background: transparent;
    }

    .mergeField input:focus {
      box-shadow: none;
    }

    .mergeBtn {
      border: none;
      background: var(--brand);
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .mergeBtn:hover {
      background: var(--brand-dark);
    }

    .panelSection { display: none; }
    .panelSection.active { display: block; }

    @media (max-width: 920px) {
      .frame {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .grid.two {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="assets/logo.png" alt="Inebura logo" />
    
  </div>

  <main class="frame">
    <section class="cover">
      <h1>Login before the aging report starts telling jokes.</h1>
      <p>Sign in fast. Because your invoices already know how to stay outstanding.</p>
      <div class="stat">
        <div class="statCard">PTP = Promise To Pay... or Promise To Press login.</div>
        <div class="statCard">Outstanding balance: one successful sign-in.</div>
      </div>
    </section>

    <section class="panel">
      <div>
        <h2>Welcome back!</h2>
        <p>Choose a method and keep the DSO jokes to a minimum.</p>
      </div>

      <div class="switch" role="tablist">
        <button class="active" type="button" data-panel="panel-password">Username</button>
        <button type="button" data-panel="panel-email">Email OTP</button>
        <button type="button" data-panel="panel-whatsapp">WhatsApp OTP</button>
      </div>

      <div class="panelSection active" id="panel-password">
        <div class="grid">
          <div>
            <label for="loginUsername2">Username</label>
            <input id="loginUsername2" type="text" placeholder="Username" />
          </div>
          <div>
            <label for="loginPassword2">Password</label>
            <input id="loginPassword2" type="password" placeholder="Password" />
          </div>
          <button class="primaryBtn" type="button">Login</button>
        </div>
      </div>

      <div class="panelSection" id="panel-email">
        <div class="grid">
          <div>
            <label for="emailLogin2">Email ID</label>
            <div class="mergeField">
              <input id="emailLogin2" type="email" placeholder="name@company.com" />
              <button class="mergeBtn" type="button">Send OTP</button>
            </div>
          </div>
          <div>
            <label for="emailOtp2">OTP</label>
            <input id="emailOtp2" type="text" placeholder="6-digit OTP" />
          </div>
          <button class="primaryBtn" type="button">Verify and Login</button>
        </div>
      </div>

      <div class="panelSection" id="panel-whatsapp">
        <div class="grid">
          <div>
            <label for="waLogin2">WhatsApp Number</label>
            <div class="mergeField">
              <input id="waLogin2" type="tel" placeholder="+91 98xxxxxx21" />
              <button class="mergeBtn" type="button">Send OTP</button>
            </div>
          </div>
          <div>
            <label for="waOtp2">OTP</label>
            <input id="waOtp2" type="text" placeholder="6-digit OTP" />
          </div>
          <button class="primaryBtn" type="button">Verify and Login</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const switches = document.querySelectorAll(".switch button");
    const panels = document.querySelectorAll(".panelSection");

    switches.forEach((btn) => {
      btn.addEventListener("click", () => {
        switches.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const id = btn.getAttribute("data-panel");
        panels.forEach(panel => {
          panel.classList.toggle("active", panel.id === id);
        });
      });
    });
  </script>
</body>
</html>
