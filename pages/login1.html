<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inebura Ops | Login 1</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0f172a;
      --muted: #64748b;
      --brand: #0ea5e9;
      --brand-dark: #0284c7;
      --accent: #f59e0b;
      --card: #ffffff;
      --border: #e2e8f0;
      --bg: #f6f7fb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(92, 37, 141, 0.2), transparent 42%),
        radial-gradient(circle at 85% 12%, rgba(124, 58, 237, 0.16), transparent 38%),
        radial-gradient(circle at 70% 80%, rgba(245, 158, 11, 0.12), transparent 40%),
        var(--bg);
      color: var(--ink);
      padding: 24px;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 20px;
      display: inline-flex;
      align-items: flex-start;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      z-index: 5;
    }

    .logo img {
      width: 125px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
      /* border: 1px solid rgba(15, 23, 42, 0.1); */
      background: #ffffff00;
    }

    .shell {
      max-width: 1360px;
      margin: 72px auto 32px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: 32px;
      align-items: stretch;
    }

    .hero {
      background: linear-gradient(150deg, #fff4ea 0%, #eef4ff 55%, #fef3e8 100%);
      color: var(--ink);
      border-radius: 24px;
      padding: 250px 64px;
      box-shadow: 0 20px 50px rgba(92, 37, 141, 0.18);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 520px;
      justify-content: center;
    }

    .heroImage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(92, 37, 141, 0.18);
      right: -90px;
      bottom: -90px;
      z-index: 1;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 140px 56px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      text-align: left;
      min-height: 520px;
      justify-content: center;
    }

    .card h2 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 28px;
    }

    .card p {
      margin: 0;
      color: var(--muted);
    }

    .cardIntro {
      align-self: flex-start;
      text-align: left;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: min(100%, 420px);
      margin: 0;
    }

    label {
      display: block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-family: "Manrope", sans-serif;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.18);
    }

    .primaryBtn {
      border: none;
      background: var(--brand);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primaryBtn:hover { background: var(--brand-dark); }

    .defaultBtn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .defaultBtn:hover {
      border-color: var(--brand);
      color: var(--brand-dark);
    }

    .inputWithIcon {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 6px;
      background: #ffffff;
    }

    .inputWithIcon input {
      border: none;
      padding: 12px 10px;
      background: transparent;
    }

    .inputWithIcon input:focus {
      box-shadow: none;
    }

    .toggleBtn {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #64748b;
      font-size: 16px;
      padding: 0 8px;
    }

    .toggleBtn:hover {
      color: #0f172a;
    }

    .formMeta {
      display: flex;
      justify-content: flex-end;
    }

    .linkBtn {
      background: transparent;
      border: none;
      color: #4c7cff;
      font-weight: 400;
      cursor: pointer;
      padding: 0;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    @keyframes slideUp {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .animateUp {
      animation: slideUp 0.35s ease;
    }

    .notifyDock {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(320px, 92vw);
      pointer-events: none;
    }

    .notifyPopup {
      pointer-events: auto;
      background: #ffffff;
      border: 1px solid #fecaca;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 20px 34px rgba(15, 23, 42, 0.18);
    }

    .notifyPopup.error {
      border-color: #fecaca;
      background: #fff1f2;
      color: #7f1d1d;
    }

    .notifyPopup.success {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: #166534;
    }

    .notifyPopup.warning {
      border-color: #fde68a;
      background: #fffbeb;
      color: #92400e;
    }

    .notifyPopup strong {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .notifyPopup span {
      font-size: 12px;
      color: inherit;
    }

    .notifyClose {
      margin-left: auto;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .otpRow {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .otpRow input {
      text-align: center;
      font-size: 16px;
      padding: 10px 0;
    }

    .btnCTA {
      background: linear-gradient(135deg, #5c258d 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 22px rgba(92, 37, 141, 0.25);
      cursor: pointer;
    }

    .orDivider {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .optionGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: min(100%, 460px);
      margin: 0;
    }

    .optionGrid.hasGap {
      margin-top: 24px;
    }

    .optionCard {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      background: #f8fafc;
    }

    .optionCard.active {
      border-color: rgba(92, 37, 141, 0.35);
      box-shadow: 0 10px 20px rgba(92, 37, 141, 0.12);
      background: #ffffff;
    }

    .optionCard h4 {
      margin: 0 0 6px;
      font-size: 14px;
    }

    .optionCard p {
      margin: 0 0 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .ghostBtn {
      border: 1px dashed var(--border);
      background: transparent;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .optionTitle {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .optionAction {
      display: flex;
      justify-content: center;
    }

    @media (max-width: 920px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .optionGrid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="../assets/logo.png" alt="Inebura logo" />
  </div>

  <main class="shell">
    <section class="hero">
      <img class="heroImage" id="heroImage" src="../assets/image1.png" alt="Inebura illustration" />
    </section>

    <section class="card">
      <div class="cardIntro">
        <h2>Welcome back!</h2>
        <p>Use your primary credentials or request an OTP.</p>
      </div>

      <div class="stack">
        <div>
          <label for="loginUsername" id="loginUsernameLabel">Username or Email</label>
          <input id="loginUsername" type="text" placeholder="Enter username or email" />
        </div>
        <div id="passwordField">
          <label for="loginPassword">Password</label>
          <div class="inputWithIcon">
            <input id="loginPassword" type="password" placeholder="Enter password" />
            <button class="toggleBtn" type="button" id="togglePassword" aria-label="Show password">
              <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="hidden" id="otpField">
          <label for="otpBox1" id="loginOtpLabel">OTP</label>
          <div class="otpRow">
            <input id="otpBox1" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 1" />
            <input id="otpBox2" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 2" />
            <input id="otpBox3" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 3" />
            <input id="otpBox4" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 4" />
            <input id="otpBox5" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 5" />
            <input id="otpBox6" type="text" inputmode="numeric" maxlength="1" aria-label="OTP digit 6" />
          </div>
        </div>
        <div class="formMeta">
          <button class="linkBtn" type="button" id="forgotPasswordBtn">Forgot password?</button>
          <button class="linkBtn hidden" type="button" id="resendOtpBtn">Resend OTP</button>
        </div>
        <button class="btnCTA" type="button" id="loginBtn">Login</button>
        <div class="orDivider hidden" id="otpOrDivider">or</div>
        <button class="defaultBtn hidden" type="button" id="passwordLoginBtn">Login with password</button>
      </div>

      <div class="optionGrid hasGap">
        <div class="optionCard" data-mode="email">
          <h4 class="optionTitle"><i class="bi bi-envelope" aria-hidden="true"></i>Login with Email OTP</h4>
          <p>Get a one-time passcode on your email.</p>
          <div class="optionAction">
            <button class="ghostBtn" type="button" data-action="otp-email">Continue</button>
          </div>
        </div>
        <div class="optionCard" data-mode="phone">
          <h4 class="optionTitle"><i class="bi bi-phone" aria-hidden="true"></i>Login with Phone OTP</h4>
          <p>Receive the OTP on your registered phone.</p>
          <div class="optionAction">
            <button class="ghostBtn" type="button" data-action="otp-phone">Continue</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="notifyDock" id="notifyDock" aria-live="polite" aria-atomic="true"></div>

  <script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("loginPassword");

    if (togglePassword && passwordInput) {
      togglePassword.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        togglePassword.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");
        const icon = togglePassword.querySelector("i");
        if (icon) {
          icon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";
        }
      });
    }
  </script>
  <script>
    const heroImages = [
      "../assets/image1.png",
      "../assets/image2.png",
      "../assets/image3.png",
      "../assets/image4.png",
      "../assets/image5.png"
    ];
    const heroImage = document.getElementById("heroImage");
    if (heroImage) {
      const next = heroImages[Math.floor(Math.random() * heroImages.length)];
      heroImage.src = next;
    }
  </script>
  <script>
    const usernameLabel = document.getElementById("loginUsernameLabel");
    const usernameInput = document.getElementById("loginUsername");
    const passwordField = document.getElementById("passwordField");
    const otpField = document.getElementById("otpField");
    const otpLabel = document.getElementById("loginOtpLabel");
    const optionCards = document.querySelectorAll(".optionCard[data-mode]");
    const forgotPasswordBtn = document.getElementById("forgotPasswordBtn");
    const resendOtpBtn = document.getElementById("resendOtpBtn");
    const passwordLoginBtn = document.getElementById("passwordLoginBtn");
    const otpOrDivider = document.getElementById("otpOrDivider");
    const loginBtn = document.getElementById("loginBtn");
    const notifyDock = document.getElementById("notifyDock");

    const mockUsers = [
      {
        username: "admin",
        email: "admin@inebura.com",
        phone: "9876543210",
        password: "Admin@123",
        otp: "123456"
      },
      {
        username: "agent",
        email: "agent@inebura.com",
        phone: "9999999999",
        password: "pass",
        otp: "654321",
        role: "agent",
        firstName: "Devashish",
        lastName: "Agent1",
        displayName: "Devashish Agent1"
      }
    ];

    const systemStatus = {
      loginAvailable: true,
      otpServiceAvailable: true
    };

    const normalizeEmail = (value) => value.trim().toLowerCase();
    const normalizePhone = (value) => value.replace(/\D/g, "");

    const getOtpValue = () => {
      return Array.from(document.querySelectorAll(".otpRow input"))
        .map((input) => input.value.trim())
        .join("");
    };

    const findUserByUsernameOrEmail = (value) => {
      const identifier = value.trim();
      if (!identifier) return null;
      const lowered = identifier.toLowerCase();
      return mockUsers.find((user) => (
        user.username.toLowerCase() === lowered || user.email.toLowerCase() === lowered
      )) || null;
    };

    const findUserByEmail = (value) => {
      const email = normalizeEmail(value);
      if (!email) return null;
      return mockUsers.find((user) => user.email.toLowerCase() === email) || null;
    };

    const findUserByPhone = (value) => {
      const phone = normalizePhone(value);
      if (!phone) return null;
      return mockUsers.find((user) => normalizePhone(user.phone) === phone) || null;
    };

    const notifyIcons = {
      success: "bi-check-circle-fill",
      warning: "bi-exclamation-circle-fill",
      error: "bi-exclamation-triangle-fill"
    };

    const showNotify = (type, title, message) => {
      if (!notifyDock) return;
      const safeType = notifyIcons[type] ? type : "error";
      const heading = title || (safeType === "success" ? "Success" : safeType === "warning" ? "Warning" : "Error");
      const popup = document.createElement("div");
      popup.className = `notifyPopup ${safeType} animateUp`;
      popup.innerHTML = `
        <i class="bi ${notifyIcons[safeType]}" aria-hidden="true"></i>
        <div>
          <strong>${heading}</strong>
          <span>${message || ""}</span>
        </div>
        <button class="notifyClose" type="button" aria-label="Dismiss">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      `;
      const closeBtn = popup.querySelector(".notifyClose");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          popup.remove();
        });
      }
      notifyDock.prepend(popup);
      setTimeout(() => {
        if (!popup.isConnected) return;
        popup.remove();
      }, 4000);
    };

    const handleLoginSuccess = (user, message) => {
      showNotify("success", "Login successful", message || "Welcome back.");
      const role = user.role || (user.username === "agent" ? "agent" : "admin");
      const displayName = user.displayName || user.username || "User";
      localStorage.setItem("activeUserRole", role);
      localStorage.setItem("activeUserName", displayName);
      localStorage.setItem("userProfile", JSON.stringify({
        firstName: user.firstName || displayName,
        lastName: user.lastName || "",
        email: user.email || "",
        loginId: user.username || displayName,
        role
      }));
      if (user.username === "agent") {
        window.location.href = "LPagent.html";
      }
    };

    let currentMode = "default";

    const setLoginMode = (mode) => {
      const normalizedMode = mode === "email" || mode === "phone" ? mode : "default";
      currentMode = normalizedMode;
      optionCards.forEach(card => card.classList.toggle("active", card.getAttribute("data-mode") === normalizedMode));
      if (normalizedMode === "email") {
        if (usernameLabel) usernameLabel.textContent = "Email";
        if (usernameInput) usernameInput.placeholder = "Enter email";
        if (otpLabel) otpLabel.textContent = "Email OTP";
        if (passwordField) passwordField.classList.add("hidden");
        if (otpField) otpField.classList.remove("hidden");
        if (forgotPasswordBtn) forgotPasswordBtn.classList.add("hidden");
        if (resendOtpBtn) resendOtpBtn.classList.remove("hidden");
        if (passwordLoginBtn) passwordLoginBtn.classList.remove("hidden");
        if (otpOrDivider) otpOrDivider.classList.remove("hidden");
        return;
      }
      if (normalizedMode === "phone") {
        if (usernameLabel) usernameLabel.textContent = "Phone Number";
        if (usernameInput) usernameInput.placeholder = "Enter phone number";
        if (otpLabel) otpLabel.textContent = "Phone OTP";
        if (passwordField) passwordField.classList.add("hidden");
        if (otpField) otpField.classList.remove("hidden");
        if (forgotPasswordBtn) forgotPasswordBtn.classList.add("hidden");
        if (resendOtpBtn) resendOtpBtn.classList.remove("hidden");
        if (passwordLoginBtn) passwordLoginBtn.classList.remove("hidden");
        if (otpOrDivider) otpOrDivider.classList.remove("hidden");
        return;
      }
      if (usernameLabel) usernameLabel.textContent = "Username or Email";
      if (usernameInput) usernameInput.placeholder = "Enter username or email";
      if (passwordField) passwordField.classList.remove("hidden");
      if (otpField) otpField.classList.add("hidden");
      if (forgotPasswordBtn) forgotPasswordBtn.classList.remove("hidden");
      if (resendOtpBtn) resendOtpBtn.classList.add("hidden");
      if (passwordLoginBtn) passwordLoginBtn.classList.add("hidden");
      if (otpOrDivider) otpOrDivider.classList.add("hidden");
      optionCards.forEach(card => card.classList.remove("active"));
    };

    document.querySelectorAll("[data-action='otp-email']").forEach((btn) => {
      btn.addEventListener("click", () => setLoginMode("email"));
    });
    document.querySelectorAll("[data-action='otp-phone']").forEach((btn) => {
      btn.addEventListener("click", () => setLoginMode("phone"));
    });
    if (passwordLoginBtn) {
      passwordLoginBtn.addEventListener("click", () => setLoginMode("default"));
    }
    if (loginBtn) {
      loginBtn.addEventListener("click", () => {
        if (!systemStatus.loginAvailable) {
          showNotify("error", "Something went wrong", "Unable to login due to server side issue.");
          return;
        }

        const identifier = usernameInput ? usernameInput.value : "";
        if (currentMode === "email") {
          const user = findUserByEmail(identifier);
          if (!user) {
            showNotify("warning", "User not found", "User not found.");
            return;
          }
          const otpValue = getOtpValue();
          if (otpValue !== user.otp) {
            showNotify("warning", "Incorrect Password/OTP", "Incorrect password or OTP.");
            return;
          }
          handleLoginSuccess(user, "Email OTP verified successfully.");
          return;
        }

        if (currentMode === "phone") {
          const user = findUserByPhone(identifier);
          if (!user) {
            showNotify("warning", "User not found", "User not found.");
            return;
          }
          const otpValue = getOtpValue();
          if (otpValue !== user.otp) {
            showNotify("warning", "Incorrect Password/OTP", "Incorrect password or OTP.");
            return;
          }
          handleLoginSuccess(user, "Phone OTP verified successfully.");
          return;
        }

        const user = findUserByUsernameOrEmail(identifier);
        if (!user) {
          showNotify("warning", "User not found", "User not found.");
          return;
        }
        const password = passwordInput ? passwordInput.value : "";
        if (password !== user.password) {
          showNotify("warning", "Incorrect Password/OTP", "Incorrect password or OTP.");
          return;
        }
        handleLoginSuccess(user, "Welcome back.");
      });
    }
    if (resendOtpBtn) {
      resendOtpBtn.addEventListener("click", () => {
        if (!systemStatus.otpServiceAvailable) {
          showNotify("error", "Unable to send OTP", "Try again after sometime.");
          return;
        }
        const identifier = usernameInput ? usernameInput.value : "";
        const user = currentMode === "email" ? findUserByEmail(identifier) : findUserByPhone(identifier);
        if (!user) {
          showNotify("warning", "User not found", "User not found.");
          return;
        }
        showNotify("success", "OTP sent", "A new OTP has been sent.");
      });
    }

    setLoginMode("default");
  </script>
  <script>
    const otpInputs = document.querySelectorAll(".otpRow input");
    otpInputs.forEach((input, idx) => {
      input.addEventListener("focus", () => {
        input.select();
      });

      input.addEventListener("input", () => {
        const value = input.value.replace(/\D/g, "");
        if (!value) {
          input.value = "";
          return;
        }

        if (value.length > 1) {
          let cursor = idx;
          value.split("").forEach((digit) => {
            if (cursor >= otpInputs.length) return;
            otpInputs[cursor].value = digit;
            cursor += 1;
          });
          if (cursor < otpInputs.length) otpInputs[cursor].focus();
          return;
        }

        input.value = value;
        const next = otpInputs[idx + 1];
        if (next) next.focus();
      });

      input.addEventListener("paste", (event) => {
        const text = (event.clipboardData || window.clipboardData).getData("text");
        const digits = String(text || "").replace(/\D/g, "");
        if (!digits) return;
        event.preventDefault();
        let cursor = idx;
        digits.split("").forEach((digit) => {
          if (cursor >= otpInputs.length) return;
          otpInputs[cursor].value = digit;
          cursor += 1;
        });
        if (cursor < otpInputs.length) otpInputs[cursor].focus();
      });

      input.addEventListener("keydown", (event) => {
        if (/^\d$/.test(event.key) && input.value) {
          event.preventDefault();
          input.value = event.key;
          const next = otpInputs[idx + 1];
          if (next) next.focus();
          return;
        }
        if (event.key === "Backspace" && !input.value && idx > 0) {
          otpInputs[idx - 1].focus();
        }
      });
    });
  </script>
</body>
</html>
